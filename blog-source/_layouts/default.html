<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "https://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="https://www.w3.org/1999/xhtml" xml:lang="en" lang="en-us">
<head>
	<meta http-equiv="content-type" content="text/html; charset=utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{{ page.title }} | Samvit Jain</title>
	<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Samvit Jain writes about the tech industry, startups, personal experience, and occasionally interesting papers in machine learning and computer systems.{% endif %}" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

	<meta property="og:type" content="article" />
	<meta property="og:title" content="{{ page.title }}" />
	<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}Samvit Jain writes about the tech industry, startups, personal experience, and occasionally interesting papers in machine learning and computer systems.{% endif %}" />
	<meta property="og:url" content="{{ site.baseurl }}{{ page.url }}" />
	<meta name="twitter:card" content="summary" />

	<link rel="stylesheet" href="{{ site.baseurl }}/css/text.css" type="text/css" media="screen, projection" />
	<link rel="stylesheet" href="../css/text.css" type="text/css" media="screen, projection" />
	<link rel="stylesheet" href="{{ site.baseurl }}/css/style.css" type="text/css" media="screen, projection" />
	<link rel="stylesheet" href="../css/style.css" type="text/css" media="screen, projection" />
</head>
<body>
  <div id="header">
    <h1><a href="https://samvitjain.com">Samvit Jain</a>'s <a href="{{ site.baseurl }}">blog</a></h1>
<span> </span>
  </div>
  <hr />
<div class="content">
    {{ content }}
</div>

<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1/MathJax.js?config=TeX-MML-AM_CHTML"></script>
<script type="text/javascript">
 MathJax.Hub.Config({
  tex2jax: {
    inlineMath: [['\\(','\\)']],
    processEscapes: true
  }
});</script>
</body>
</html>
