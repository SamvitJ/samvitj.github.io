<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{{ page.title }} | Samvit Jain</title>
	<meta name="description" content="{% if page.description %}{{ page.description }}{% else %}Samvit Jain writes on startups, the tech industry, machine learning, and what he has learned along the way.{% endif %}" />
	<link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />

	<meta property="og:type" content="article" />
	<meta property="og:title" content="{{ page.title }}" />
	<meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}Samvit Jain writes on startups, the tech industry, machine learning, and what he has learned along the way.{% endif %}" />
	<meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}" />
	<meta name="twitter:card" content="summary" />

	<!-- Shared sitewide stylesheet. Bump ?v= whenever css/site.css changes;
	     it is referenced from every page on the site, not just here. -->
	<link rel="stylesheet" href="/css/site.css?v=4" />
	<!-- Blog-only: the star-rating widget used by the Evaluating Startups posts. -->
	<link rel="stylesheet" href="{{ site.baseurl }}/css/style.css?v=4" />
</head>
<body>
	<div class="site">
		<header class="site-header">
			<a class="wordmark" href="/">Samvit Jain</a>
			<nav class="site-nav">
				<a href="/research/">Research</a>
				<a href="{{ site.baseurl }}/" aria-current="page">Blog</a>
			</nav>
		</header>

		<main class="prose">
			{{ content }}
		</main>
	</div>

<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1/MathJax.js?config=TeX-MML-AM_CHTML"></script>
<script type="text/javascript">
 MathJax.Hub.Config({
  tex2jax: {
    inlineMath: [['\\(','\\)']],
    processEscapes: true
  }
});</script>
</body>
</html>
